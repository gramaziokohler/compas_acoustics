name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-change:
    name: Detect release merge
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
    steps:
      - uses: compas-dev/compas-actions/release-check@v1
        id: release

  build:
    needs: release-change
    if: github.event_name == 'pull_request' || needs.release-change.outputs.is-release != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) has no Python 3.9 in actions/setup-python; 24.04 has
        os: [ubuntu-24.04, macos-latest, windows-latest]
        # 3.9 is the Python of Rhino 8
        python: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.9"
    env:
      # the tests in parallel on the runner's cores (pytest-xdist, from requirements-dev.txt)
      PYTEST_ADDOPTS: "-n auto"
    steps:
      - uses: compas-dev/compas-actions/ci@v1
        with:
          python-version: ${{ matrix.python }}
          management-tool: uv
          invoke-tasks: lint test format

  grasshopper-plugin-test:
    needs: release-change
    if: github.event_name == 'pull_request' || needs.release-change.outputs.is-release != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Test the Grasshopper plugin
        run: dotnet test src/compas_acoustics_ghcsharp/CompasAcoustics.sln

  hybrid-simulation-test:
    needs: release-change
    if: github.event_name == 'pull_request' || needs.release-change.outputs.is-release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # On Python >= 3.11 compas_acoustics requires the hybrid method's packages; torch from the CPU index (no CUDA)
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . pytest
      # the slow wheel test runs in the build job
      - run: python -m pytest tests/hybrid tests/test_worker_api.py tests/test_pb.py -m "not slow"
