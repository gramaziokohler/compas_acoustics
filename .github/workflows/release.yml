name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Detect release merge
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: compas-dev/compas-actions/release-check@v1
        id: release

  build:
    needs: release
    if: needs.release.outputs.is-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9 is the Python of Rhino 8
        python: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: compas-dev/compas-actions/ci@v1
        with:
          python-version: ${{ matrix.python }}
          management-tool: uv
          invoke-tasks: lint test

  prepare:
    needs: [release, build]
    if: needs.release.outputs.is-release == 'true'
    # the protobuf bindings are committed, pre-build has nothing to make
    runs-on: windows-latest
    steps:
      - uses: compas-dev/compas-actions/prepare-release@v1
        with:
          python-version: "3.12"
          management-tool: uv
          run-prebuild: true

  installer-bundle:
    needs: [release, build]
    if: needs.release.outputs.is-release == 'true'
    # the Grasshopper plugin builds with the .NET SDK that Windows runners have
    runs-on: windows-latest
    steps:
      - uses: compas-dev/compas-actions/release-assets@v1
        with:
          python-version: "3.12"
          management-tool: uv
          extras: dev
          invoke-tasks: installer-bundle
          paths: dist/compas_acoustics_installer.zip
          artifact-name: github-release-assets-installer

  # PyPI Trusted Publishing: owner gramaziokohler, repo compas_acoustics, workflow release.yml, environment pypi
  publish:
    needs: [release, prepare]
    if: needs.release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  create-release:
    needs: [release, prepare, installer-bundle, publish]
    if: needs.release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: compas-dev/compas-actions/github-release@v1
        with:
          github-token: ${{ github.token }}
          tag-name: ${{ needs.release.outputs.tag }}
          target: ${{ github.sha }}
          release-name-prefix: COMPAS Acoustics
          release-assets-artifact-pattern: github-release-assets-*
