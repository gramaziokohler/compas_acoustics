[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

# ============================================================================
# project info
# ============================================================================

[project]
name = "compas_acoustics"
description = "Room acoustic simulation, analysis and auralisation for COMPAS, with a Grasshopper plugin for Rhino 8."
keywords = ["acoustics", "room acoustics", "auralisation", "impulse response", "ray tracing", "image source method", "ambisonics", "binaural", "compas", "grasshopper", "rhino"]
authors = [
    {name = "Achilleas Xydis"},
    {name = "Georgios Papadimitriou"},
    {name = "Hao Cheng Wang"},
    {name = "Gardar Edvaldsson"},
    {name = "Gonzalo Casas"},
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dynamic = ['dependencies', 'optional-dependencies', 'version']
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://gramaziokohler.github.io/compas_acoustics"
Documentation = "https://gramaziokohler.github.io/compas_acoustics"
Repository = "https://github.com/gramaziokohler/compas_acoustics"
Changelog = "https://github.com/gramaziokohler/compas_acoustics/blob/main/CHANGELOG.md"
Issues = "https://github.com/gramaziokohler/compas_acoustics/issues"
Forum = "https://forum.compas-framework.org/"

# ============================================================================
# setuptools config
# ============================================================================

[project.entry-points.'compas_pb.plugins']
serializers = "compas_acoustics.pb.conversions"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "compas_acoustics.__version__" }
dependencies = { file = "requirements.txt" }
optional-dependencies = { dev = { file = "requirements-dev.txt" }, docs = { file = "requirements-docs.txt" } }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compas_acoustics = [
    "materials_library/*.json",
    "hrtfs_library/*.sofa",
    "hrtfs_library/README.md",
    "anechoic_soundfiles_library/*",
    "pb/protobuf_defs/compas_acoustics/pb/generated/*.proto",
]

# ============================================================================
# replace pytest.ini
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/compas_acoustics"]
python_files = ["test_*.py", "*_test.py", "test.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--doctest-glob=*.rst",
    "--tb=short",
    "--import-mode=importlib",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]
markers = [
    "slow: long-running numerical checks (deselect with -m 'not slow')",
]

# ============================================================================
# replace bumpversion.cfg
# ============================================================================

[tool.bumpversion]
current_version = "0.1.0"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_acoustics/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "src/compas_acoustics_ghcsharp/CompasAcoustics.Grasshopper/CompasAcoustics.Grasshopper.csproj"
search = "<Version>{current_version}</Version>"
replace = "<Version>{new_version}</Version>"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# replace setup.cfg
# ============================================================================

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]
# generated by protoc (invoke generate)
"src/compas_acoustics/pb/generated/*" = ["E402", "E501", "F401", "I001"]
# the hybrid modules and their tests keep the papers' single-letter symbols and their own import order
"src/compas_acoustics/hybrid/*" = ["I001", "E741"]
"tests/hybrid/test_*.py" = ["I001", "E731", "E741"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["compas_acoustics"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
